# The proxy reads the request body itself and replays it upstream verbatim — twice over, when a key
# is refused and the request is retried. Spring's form-content filter would consume that body first
# on PUT/PATCH/DELETE with a form content type, leaving the upstream with an empty one, so it is off
# here as it is in apps/reverse-proxy.
spring.mvc.formcontent.filter.enabled=false
