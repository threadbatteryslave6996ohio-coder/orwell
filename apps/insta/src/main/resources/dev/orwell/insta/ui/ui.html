<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insta — follow graph</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b35;
    --ink: #e6e9ef; --dim: #8b93a3;
    --active: #4c8dff; --gone: #ff5c7a; --subject: #ffcf5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 14px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: .02em; }
  select, input, button { background: #10131a; color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: #3a4252; }
  label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  main { display: flex; height: calc(100vh - 53px); }
  #canvasWrap { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  aside { width: 320px; border-left: 1px solid var(--line); background: var(--panel);
          overflow-y: auto; padding: 12px 14px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--dim); margin: 0 0 8px; font-weight: 600; }
  .row { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .who { font-weight: 600; }
  .when { color: var(--dim); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px;
         border: 1px solid var(--line); color: var(--dim); margin-left: 6px; }
  .ext { color: var(--active); text-decoration: none; font-size: 12px; border: 1px solid var(--line);
         border-radius: 6px; padding: 5px 8px; }
  .ext:hover { border-color: var(--active); }
  aside a { color: inherit; text-decoration: none; }
  aside a:hover { text-decoration: underline; }
  .legend { display: flex; gap: 14px; color: var(--dim); font-size: 12px; margin-left: auto; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-right: 5px; vertical-align: -1px; }
  #status { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; }
  #card { position: absolute; width: 288px; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; padding: 14px;
          box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; z-index: 5; }
  #card h3 { margin: 0; font-size: 15px; }
  #card .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #card .bio { margin: 10px 0 0; font-size: 13px; white-space: pre-wrap;
               border-left: 2px solid var(--line); padding-left: 8px; }
  #card .stats { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--dim); }
  #card .stats b { color: var(--ink); font-weight: 600; }
  #card .rel { margin-top: 10px; font-size: 12px; color: var(--dim); }
  #card .actions { display: flex; gap: 8px; margin-top: 12px; }
  #card .actions a, #card .actions button { flex: 1; text-align: center; }
  #cardClose { position: absolute; top: 8px; right: 8px; border: 0; background: transparent;
               color: var(--dim); font-size: 16px; padding: 2px 6px; }
  #cardClose:hover { color: var(--ink); }
  .thin { color: var(--dim); font-style: italic; }
  #tip { position: absolute; pointer-events: none; background: #0b0d12; border: 1px solid var(--line);
         padding: 4px 8px; border-radius: 6px; font-size: 12px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>insta</h1>
  <select id="account"></select>
  <label><input type="checkbox" id="inactive"> show departed</label>
  <button id="reload">reload</button>
  <a id="openSubject" class="ext" target="_blank" rel="noopener noreferrer">open on instagram ↗</a>
  <span class="legend">
    <span><i class="swatch" style="background:var(--subject)"></i>subject</span>
    <span><i class="swatch" style="background:var(--active)"></i>following</span>
    <span><i class="swatch" style="background:var(--gone)"></i>left</span>
  </span>
</header>
<main>
  <div id="canvasWrap">
    <canvas id="graph"></canvas>
    <div id="status">loading…</div>
    <div id="tip"></div>
    <div id="card"><button id="cardClose" title="close">×</button><div id="cardBody"></div></div>
  </div>
  <aside>
    <h2>recent departures</h2>
    <div id="unfollows"><div class="row when">nothing recorded yet</div></div>
  </aside>
</main>
<script>
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
let nodes = [], links = [], hover = null, frame = null;

function fit() {
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return r;
}

// A small force layout: neighbours pull together, everything pushes apart, the centre holds.
// Deliberately hand-rolled — one screen of maths beats a dependency for a page like this.
function step(w, h) {
  const centreX = w / 2, centreY = h / 2;
  for (const a of nodes) {
    a.vx = (a.vx || 0) * 0.86; a.vy = (a.vy || 0) * 0.86;
    a.vx += (centreX - a.x) * 0.0016; a.vy += (centreY - a.y) * 0.0016;
  }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy || 0.01;
      if (d2 > 90000) continue;                 // ignore distant pairs: O(n²) with a short leash
      const f = 900 / d2;
      const d = Math.sqrt(d2);
      const ux = dx / d, uy = dy / d;
      a.vx -= ux * f; a.vy -= uy * f; b.vx += ux * f; b.vy += uy * f;
    }
  }
  for (const l of links) {
    const a = l.a, b = l.b;
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const f = (d - 110) * 0.006;
    const ux = dx / d, uy = dy / d;
    a.vx += ux * f; a.vy += uy * f; b.vx -= ux * f; b.vy -= uy * f;
  }
  for (const a of nodes) {
    if (a.subject) { a.x = centreX; a.y = centreY; continue; }
    a.x += Math.max(-6, Math.min(6, a.vx));
    a.y += Math.max(-6, Math.min(6, a.vy));
  }
}

function radius(n) { return n.subject ? 11 : 4 + Math.min(6, Math.log10(1 + n.followers) * 3); }

function draw(w, h) {
  ctx.clearRect(0, 0, w, h);
  for (const l of links) {
    if (!l.a || !l.b) continue;
    ctx.beginPath();
    ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y);
    ctx.strokeStyle = l.active ? 'rgba(76,141,255,.28)' : 'rgba(255,92,122,.5)';
    ctx.setLineDash(l.active ? [] : [3, 3]);
    ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
  }
  for (const n of nodes) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, radius(n), 0, Math.PI * 2);
    ctx.fillStyle = n.subject ? getVar('--subject') : (n.gone ? getVar('--gone') : getVar('--active'));
    ctx.fill();
    if (n === hover || n.subject) {
      ctx.fillStyle = getVar('--ink');
      ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
      ctx.fillText('@' + (n.username || n.id), n.x + radius(n) + 5, n.y + 4);
    }
  }
}

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function loop() {
  const r = canvas.getBoundingClientRect();
  step(r.width, r.height);
  draw(r.width, r.height);
  frame = requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', event => {
  const r = canvas.getBoundingClientRect();
  const x = event.clientX - r.left, y = event.clientY - r.top;
  hover = nodes.find(n => Math.hypot(n.x - x, n.y - y) <= radius(n) + 4) || null;
  canvas.style.cursor = hover ? 'pointer' : 'default';
  if (hover) {
    tip.style.display = 'block';
    tip.style.left = (x + 12) + 'px'; tip.style.top = (y + 12) + 'px';
    tip.textContent = '@' + (hover.username || hover.id) + ' · ' + hover.followers
      + ' followers · click for details';
  } else { tip.style.display = 'none'; }
});

// Clicking a node opens a card rather than navigating away: most of what you want to know is
// already in the database, and leaving the page would throw away the layout the graph settled into.
const card = document.getElementById('card');
const cardBody = document.getElementById('cardBody');
let cardFor = null;

canvas.addEventListener('click', event => {
  if (!hover) { hideCard(); return; }
  const r = canvas.getBoundingClientRect();
  showCard(hover, event.clientX - r.left, event.clientY - r.top);
});

document.getElementById('cardClose').addEventListener('click', hideCard);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCard(); });

function hideCard() { card.style.display = 'none'; cardFor = null; }

async function showCard(node, x, y) {
  cardFor = node.id;
  card.style.display = 'block';
  // Keep it on screen: flip to the left of the cursor when there is no room to the right.
  const wrap = canvas.parentElement.getBoundingClientRect();
  card.style.left = Math.min(x + 14, wrap.width - 300) + 'px';
  card.style.top = Math.min(y + 14, Math.max(8, wrap.height - 260)) + 'px';
  cardBody.innerHTML = '<div class="sub">loading…</div>';

  const account = document.getElementById('account').value;
  const response = await fetch('/api/account?id=' + encodeURIComponent(node.id)
    + '&account=' + encodeURIComponent(account));
  if (cardFor !== node.id) return;            // a later click won the race
  if (!response.ok) { cardBody.innerHTML = '<div class="sub">no details recorded</div>'; return; }
  render(await response.json());
}

function render(a) {
  const handle = a.username || a.id;
  const former = (a.formerUsernames || []).length
    ? '<div class="sub">formerly ' + a.formerUsernames.map(u => '@' + esc(u)).join(', ') + '</div>'
    : '';
  const bio = a.bio
    ? '<p class="bio">' + esc(a.bio) + '</p>'
    : '';
  // An outer-ring account has a handle and nothing else: say so rather than showing zeroes as if
  // they were measurements.
  const stats = a.walked
    ? '<div class="stats"><span><b>' + a.followers + '</b> followers</span>'
      + '<span><b>' + a.following + '</b> following</span>'
      + '<span><b>' + a.posts + '</b> posts</span></div>'
    : '<div class="stats thin">not synced — only seen as a follower</div>';

  let rel = '';
  if (a.relation) {
    const since = String(a.relation.since).slice(0, 10);
    rel = '<div class="rel">' + (a.relation.follows
        ? 'follows you · first seen ' + since
        : 'no longer follows you')
      + (a.relation.timesLeft ? ' · left ' + a.relation.timesLeft + '×' : '') + '</div>';
  }

  cardBody.innerHTML = '<h3>@' + esc(handle) + '</h3>' + former + bio + stats + rel
    + '<div class="actions">'
    + '<a class="ext" target="_blank" rel="noopener noreferrer" href="' + profileUrl(handle)
    + '">open on instagram ↗</a></div>';
}

// Handles and bios are other people's text arriving from a scraper; it goes in as text, never HTML.
function esc(value) {
  return String(value).replace(/[&<>"']/g, c =>
    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

function profileUrl(username) {
  return 'https://www.instagram.com/' + encodeURIComponent(username) + '/';
}

async function load() {
  const account = document.getElementById('account').value;
  const inactive = document.getElementById('inactive').checked;
  const status = document.getElementById('status');
  status.textContent = 'loading…';
  const query = '?account=' + encodeURIComponent(account) + '&inactive=' + inactive;

  const response = await fetch('/api/graph' + query);
  if (!response.ok) { status.textContent = 'no graph for that account yet'; nodes = []; links = []; return; }
  const graph = await response.json();

  const r = fit();
  const byId = new Map();
  nodes = graph.nodes.map((n, i) => {
    const angle = (i / Math.max(1, graph.nodes.length)) * Math.PI * 2;
    const node = Object.assign({}, n, {
      x: r.width / 2 + Math.cos(angle) * 180 + (Math.random() - .5) * 20,
      y: r.height / 2 + Math.sin(angle) * 180 + (Math.random() - .5) * 20,
      vx: 0, vy: 0, gone: false
    });
    byId.set(n.id, node);
    return node;
  });
  links = graph.links.map(l => {
    const link = { a: byId.get(l.followee), b: byId.get(l.follower), active: l.active };
    // A node is "gone" when every edge joining it to the subject is inactive.
    if (!l.active && link.b && !link.b.subject) link.b.gone = true;
    if (l.active && link.b) link.b.gone = false;
    return link;
  });
  status.textContent = nodes.length + ' accounts · ' + links.length + ' follows';
  const subject = nodes.find(n => n.subject);
  const open = document.getElementById('openSubject');
  if (subject && subject.username) {
    open.href = profileUrl(subject.username);
    open.textContent = 'open @' + subject.username + ' ↗';
    open.style.display = '';
  } else {
    open.style.display = 'none';
  }

  const departures = await (await fetch('/api/unfollows' + query)).json();
  const panel = document.getElementById('unfollows');
  panel.innerHTML = departures.length ? '' : '<div class="row when">nothing recorded yet</div>';
  for (const d of departures) {
    const row = document.createElement('div');
    row.className = 'row';
    const handle = d.username || d.accountId;
    row.innerHTML = '<div class="who"><a target="_blank" rel="noopener noreferrer" href="'
      + profileUrl(handle) + '">@' + esc(handle) + '</a>'
      + (d.timesLeft > 1 ? '<span class="tag">left ' + d.timesLeft + '×</span>' : '')
      + (d.returned ? '<span class="tag">came back</span>' : '')
      + '</div><div class="when">' + d.at.replace('T', ' ').slice(0, 19) + '</div>';
    panel.appendChild(row);
  }
}

async function boot() {
  const accounts = await (await fetch('/api/accounts')).json();
  const select = document.getElementById('account');
  select.innerHTML = '';
  for (const a of accounts) {
    const option = document.createElement('option');
    option.value = a.id;
    option.textContent = '@' + (a.username || a.id) + '  (' + a.followers + ')';
    select.appendChild(option);
  }
  if (!accounts.length) {
    document.getElementById('status').textContent = 'nothing synced yet — run: insta sync <username>';
    return;
  }
  await load();
  if (!frame) loop();
}

document.getElementById('account').addEventListener('change', load);
document.getElementById('inactive').addEventListener('change', load);
document.getElementById('reload').addEventListener('click', boot);
window.addEventListener('resize', fit);
fit();
boot();
</script>
</body>
</html>
