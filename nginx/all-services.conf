map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = / {
        return 404;
    }

    location = /auth/health {
        proxy_pass http://auth-server:80/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth {
        return 301 /auth/;
    }

    location /auth/ {
        proxy_pass http://auth-server:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /clipboard/health {
        proxy_pass http://clipboard-server:80/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /clipboard {
        proxy_pass http://clipboard-server:80/clipboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /clipboard/ {
        proxy_pass http://clipboard-server:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /secrets/health {
        proxy_pass http://secrets-manager:8085/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /secrets {
        return 301 /secrets/;
    }

    location /secrets/ {
        proxy_pass http://secrets-manager:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /jarvis/health {
        proxy_pass http://object-storage-proxy:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /jarvis {
        return 301 /jarvis/;
    }

    location /jarvis/ {
        proxy_pass http://object-storage-proxy:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hub/health {
        proxy_pass http://jarvis-hub:9001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hub {
        return 301 /hub/;
    }

    # The SSE stream, kept separate from the routes below because a live feed needs the opposite
    # of nginx's defaults on three counts:
    #
    #   proxy_buffering off  — nginx would otherwise hold events in its own buffer and hand them
    #                          over in batches, so a viewer sees nothing and then a burst. This is
    #                          the single setting that makes SSE through a proxy look broken.
    #   proxy_read_timeout   — the default 60s kills a connection that has simply gone quiet,
    #                          which for a camera watching a still scene is normal.
    #   gzip off             — compressing a stream reintroduces buffering to fill a block.
    #
    # Note this does not need `Connection: upgrade` like the keeboarder WebSocket above: SSE is a
    # plain long-lived HTTP response, not a protocol upgrade.
    location /hub/frames/stream {
        rewrite ^/hub/?(.*)$ /$1 break;
        proxy_pass http://jarvis-hub:9001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hub/ {
        rewrite ^/hub/?(.*)$ /$1 break;
        proxy_pass http://jarvis-hub:9001;
        proxy_http_version 1.1;
        # A pushed frame is base64 in a JSON body, so it arrives ~33% larger than the JPEG. The
        # default 1m would 413 a high-resolution frame; this matches the 16 MB cap the services
        # apply to the same routes.
        client_max_body_size 16m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /person-detection/health {
        proxy_pass http://jarvis-person-detection:9002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /person-detection {
        return 301 /person-detection/health;
    }

    # Only /health. Person detection has no ingest route: it watches the hub's stream outbound
    # rather than being pushed to, so there is nothing else here to reach. Frames go to /hub/frames.
    location /person-detection/ {
        rewrite ^/person-detection/?(.*)$ /$1 break;
        proxy_pass http://jarvis-person-detection:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # jarvis-retention-worker has no route: it holds no port and serves nothing.
    # /motion is gone with the motion service.

    location = /alerting/health {
        proxy_pass http://alerting:80/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /alerting {
        return 301 /alerting/;
    }

    location /alerting/ {
        rewrite ^/alerting/?(.*)$ /$1 break;
        proxy_pass http://alerting:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /log-analyzer/health {
        proxy_pass http://log-analyzer:80/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /log-analyzer {
        return 301 /log-analyzer/;
    }

    location /log-analyzer/ {
        rewrite ^/log-analyzer/?(.*)$ /$1 break;
        proxy_pass http://log-analyzer:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /keeboarder/health {
        proxy_pass http://keeboarder-server:8025/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /keeboarder/api {
        return 301 /keeboarder/api/;
    }

    location /keeboarder/api/ {
        proxy_pass http://keeboarder-server:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /keeboarder/ws/ {
        proxy_pass http://keeboarder-server:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
